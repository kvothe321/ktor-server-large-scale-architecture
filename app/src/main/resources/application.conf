# Defaults for local development. Every value can be overridden with the environment variable
# shown next to it (HOCON `${?VAR}` substitution); see docker-compose.yml for a Postgres setup.

ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [com.tlpcraft.ktor.template.app.ApplicationKt.module]
    }
}

database {
    # Local H2 file database in PostgreSQL compatibility mode.
    jdbcUrl = "jdbc:h2:file:./data/app;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH"
    jdbcUrl = ${?DATABASE_URL}
    username = "sa"
    username = ${?DATABASE_USER}
    password = ""
    password = ${?DATABASE_PASSWORD}
    maximumPoolSize = 10
    maximumPoolSize = ${?DATABASE_POOL_SIZE}
}

storage {
    root = "./data/uploads"
    root = ${?STORAGE_ROOT}
}

httpClient {
    requestTimeout = "10s"
    requestTimeout = ${?HTTP_CLIENT_REQUEST_TIMEOUT}
    connectTimeout = "5s"
    connectTimeout = ${?HTTP_CLIENT_CONNECT_TIMEOUT}
}

weather {
    baseUrl = "https://api.open-meteo.com"
    baseUrl = ${?WEATHER_BASE_URL}
    cacheTtl = "15m"
    cacheTtl = ${?WEATHER_CACHE_TTL}
}

images {
    maxSizeBytes = 5242880
    maxSizeBytes = ${?IMAGES_MAX_SIZE_BYTES}
}
